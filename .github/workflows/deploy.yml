name: Deploy (CD)

# Етап 5 індивідуального проєкту: безперервне постачання.
#   lint       — ansible-lint плейбука розгортання;
#   rehearsal  — повна репетиція промислового розгортання тим самим плейбуком
#                (deploy/ansible/production.yml) у тимчасовому кластері kind:
#                Vault, секрети, Prometheus/Alertmanager/Grafana, застосунок через
#                Terraform, наскрізна перевірка; повторний запуск має дати changed=0;
#   production — після схвалення в середовищі production (Required reviewers)
#                фіксує версію для промислового розгортання: GitHub Release з тегами
#                образів і командою розгортання.
on:
  push:
    branches: [main]
    paths: ['backend/**', 'frontend/**', 'deploy/**', 'infra/**', '.github/workflows/deploy.yml']
  pull_request:
    branches: [main, develop]
    paths: ['deploy/**', 'infra/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  ANSIBLE_FORCE_COLOR: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ansible ansible-lint
      - name: ansible-lint
        working-directory: deploy/ansible
        run: ansible-lint production.yml

  rehearsal:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible
        run: pip install ansible kubernetes

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.x"
          terraform_wrapper: false

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: booking

      - name: Build images from this commit and load them into kind
        run: |
          docker build -t ghcr.io/danilara7/booking-service:ci backend
          docker build -t ghcr.io/danilara7/booking-frontend:ci frontend
          kind load docker-image --name booking ghcr.io/danilara7/booking-service:ci ghcr.io/danilara7/booking-frontend:ci

      # NodePort-сервіси (Vault) доступні за IP контейнера-вузла kind
      - name: Node address
        id: node
        run: echo "ip=$(docker inspect booking-control-plane --format '{{ .NetworkSettings.Networks.kind.IPAddress }}')" >> "$GITHUB_OUTPUT"

      - name: Rollout (staging rehearsal)
        working-directory: deploy/ansible
        run: ansible-playbook -i inventories/ci production.yml -e node_address=${{ steps.node.outputs.ip }}

      - name: Second run changes nothing (idempotency)
        working-directory: deploy/ansible
        # без кольорів: ANSI-коди в PLAY RECAP заважають grep
        env:
          ANSIBLE_FORCE_COLOR: "0"
          ANSIBLE_NOCOLOR: "1"
        run: |
          ansible-playbook -i inventories/ci production.yml -e node_address=${{ steps.node.outputs.ip }} | tee /tmp/second-run.log
          grep -E 'control +: ok=[0-9]+ +changed=0 .*failed=0' /tmp/second-run.log

      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pods -A
          kubectl get events -A --sort-by=.lastTimestamp | tail -40

  production:
    needs: rehearsal
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - name: Release the approved version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=${GITHUB_SHA::7}
          gh release create "prod-$SHA" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Production $SHA" --notes "$(cat <<EOF
          Версію схвалено для промислового середовища після успішної репетиції розгортання.

          Образи: ghcr.io/danilara7/booking-service:$SHA, ghcr.io/danilara7/booking-frontend:$SHA

          Розгортання (керуючий вузол з доступом до кластера):
          \`\`\`
          cd deploy/ansible
          ansible-playbook -i inventories/production production.yml -e image_tag=$SHA
          \`\`\`
          EOF
          )"
