name: Automated Tests

# Етап 4 індивідуального проєкту: автоматизоване тестування розгорнутого
# застосунку. Модульні тести — у booking-ci.yml; тут — тести всього стека
# (Nginx → booking-service → PostgreSQL), піднятого через Docker Compose:
#   api-tests — колекція Postman (tests/api), запуск через Newman;
#   e2e-tests — сценарії користувача в Chrome (tests/e2e, Selenium + pytest).
on:
  push:
    branches: [main, develop, 'feature/**']
    paths: ['backend/**', 'frontend/**', 'tests/**', 'docker-compose.yml', '.github/workflows/tests.yml']
  pull_request:
    branches: [main, develop]
    paths: ['backend/**', 'frontend/**', 'tests/**', 'docker-compose.yml', '.github/workflows/tests.yml']

permissions:
  contents: read

jobs:
  api-tests:
    name: API tests (Postman/Newman)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up -d --build --wait

      - name: Collection is up to date with its generator
        run: |
          python3 tests/api/build_collection.py
          git diff --exit-code tests/api/booking.postman_collection.json

      - name: Run Newman
        run: |
          mkdir -p tests/results
          npx --yes newman@6.2.3 run tests/api/booking.postman_collection.json \
            --env-var baseUrl=http://localhost:8080/api \
            --reporters cli,junit --reporter-junit-export tests/results/newman.xml

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: tests/results/

      - name: Logs
        if: failure()
        run: docker compose logs --no-color

      - name: Clean up
        if: always()
        run: docker compose down -v

  e2e-tests:
    name: E2E tests (Selenium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up -d --build --wait

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/e2e/requirements.txt

      - name: Install Selenium and pytest
        run: pip install -r tests/e2e/requirements.txt

      # Chrome уже встановлено на ubuntu-latest; chromedriver підбирає Selenium Manager
      - name: Run E2E tests (headless Chrome)
        run: pytest tests/e2e -v --junitxml=tests/results/e2e.xml

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: |
            tests/e2e/screenshots/
            tests/results/

      - name: Logs
        if: failure()
        run: docker compose logs --no-color

      - name: Clean up
        if: always()
        run: docker compose down -v
