name: Conditional Jobs

on: [push, pull_request]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      # v3 замість v2 з інструкції: v2 працює на застарілому Node-рантаймі дій
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # порівнювати з попереднім комітом цієї ж гілки; без цього на push у
          # develop зміни рахуються відносно main і обидва фільтри дають true
          base: ${{ github.ref_name }}
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Backend changed"

  frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Frontend changed"
