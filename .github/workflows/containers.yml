name: Container Images

# Етап 2 індивідуального проєкту: збірка Docker-образів сервісів, перевірка
# всього стека через Docker Compose і публікація образів у ghcr.io.
on:
  push:
    branches: [main, develop, 'feature/**']
    paths: ['backend/**', 'frontend/**', 'docker-compose.yml', 'scripts/**', '.github/workflows/containers.yml']
  pull_request:
    branches: [main, develop]
    paths: ['backend/**', 'frontend/**', 'docker-compose.yml', 'scripts/**', '.github/workflows/containers.yml']

permissions:
  contents: read

jobs:
  # Stage 1: підняти db + booking-service + frontend і перевірити їх разом
  compose-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        # --wait чекає, доки всі сервіси стануть healthy
        run: docker compose up -d --build --wait

      - name: Show containers
        run: docker compose ps

      - name: Smoke test through Nginx
        run: ./scripts/smoke-test.sh

      - name: Data survives a restart (volume booking_data)
        run: |
          curl -fsS -X POST http://localhost:8080/api/bookings -H 'Content-Type: application/json' \
            -d '{"restaurantId":1,"date":"2030-02-01","time":"18:00","guests":2,"name":"Persist","phone":"+380500000002"}'
          docker compose restart
          docker compose up -d --wait
          curl -fsS 'http://localhost:8080/api/bookings?phone=%2B380500000002' | grep -q Persist
          echo "booking is still there after restart"

      - name: Logs
        if: always()
        run: docker compose logs --no-color

      - name: Clean up
        if: always()
        run: docker compose down -v

  # Stage 2: публікація образів (лише push у main/develop)
  publish:
    needs: compose-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: booking-service
            context: backend
          - image: booking-frontend
            context: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/danilara7/${{ matrix.image }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
