# Nginx віддає статичний веб-інтерфейс і проксіює /api/ до booking-service.
# Ім'я booking-service розв'язується вбудованим DNS мережі Docker Compose.
server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # слеш у кінці proxy_pass відкидає префікс: /api/restaurants → /restaurants
    location /api/ {
        proxy_pass http://booking-service:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
