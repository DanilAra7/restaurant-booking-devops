{{- $fe := .Values.frontend -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fe.name }}
  labels:
    {{- include "booking.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ $fe.replicaCount }}
  selector:
    matchLabels:
      {{- include "booking.selector" (list . $fe.name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "booking.labels" . | nindent 8 }}
        {{- include "booking.selector" (list . $fe.name) | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: frontend
          image: {{ include "booking.image" (list . $fe.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $fe.port }}
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          resources:
            {{- toYaml $fe.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fe.name }}
  labels:
    {{- include "booking.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "booking.selector" (list . $fe.name) | nindent 4 }}
  ports:
    - name: http
      port: {{ $fe.port }}
      targetPort: http
