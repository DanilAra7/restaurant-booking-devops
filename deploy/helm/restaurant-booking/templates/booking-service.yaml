{{- $svc := .Values.bookingService -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svc.name }}
  labels:
    {{- include "booking.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not $svc.autoscaling.enabled }}
  replicas: {{ $svc.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "booking.selector" (list . $svc.name) | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "booking.labels" . | nindent 8 }}
        {{- include "booking.selector" (list . $svc.name) | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true          # образ працює від користувача node (uid 1000)
        runAsUser: 1000
      containers:
        - name: booking-service
          image: {{ include "booking.image" (list . $svc.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
          env:
            - name: PORT
              value: {{ $svc.port | quote }}
            - name: DB_HOST
              value: {{ .Values.postgresql.name }}
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: {{ include "booking.dbSecret" . }}, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "booking.dbSecret" . }}, key: password } }
            - name: DB_NAME
              valueFrom: { secretKeyRef: { name: {{ include "booking.dbSecret" . }}, key: database } }
          # готовність — разом з БД (/health віддає 503 без неї): такий под
          # виключається з Service, але не перезапускається
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
          # liveness поблажлива: під піковим навантаженням відповідь може
          # затримуватися (дроселювання CPU), і перезапуск лише погіршив би ситуацію —
          # перезапускаємо, тільки якщо процес не відповідає ~1 хв
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $svc.name }}
  labels:
    {{- include "booking.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "booking.selector" (list . $svc.name) | nindent 4 }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
{{- if $svc.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $svc.name }}
  labels:
    {{- include "booking.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $svc.name }}
  minReplicas: {{ $svc.autoscaling.minReplicas }}
  maxReplicas: {{ $svc.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $svc.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    scaleDown:
      # не зменшувати кількість подів одразу після короткого спаду навантаження
      stabilizationWindowSeconds: 120
{{- end }}
