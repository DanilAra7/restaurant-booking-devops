{{- $db := .Values.postgresql -}}
{{- /* пароль: заданий у values, інакше — з наявного Secret (щоб не змінювався
       при helm upgrade), інакше — випадковий */ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "booking.dbSecret" .) -}}
{{- $password := $db.password | default (and $existing (index $existing.data "password" | b64dec)) | default (randAlphaNum 24) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "booking.dbSecret" . }}
  labels:
    {{- include "booking.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ $db.username | quote }}
  password: {{ $password | quote }}
  database: {{ $db.database | quote }}
---
# схема й початкові дані — той самий init.sql, що й у Docker Compose
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $db.name }}-init
  labels:
    {{- include "booking.labels" . | nindent 4 }}
data:
  init.sql: |
{{ .Files.Get "files/init.sql" | indent 4 }}
---
# headless Service — стабільне DNS-ім'я пода StatefulSet
apiVersion: v1
kind: Service
metadata:
  name: {{ $db.name }}
  labels:
    {{- include "booking.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "booking.selector" (list . $db.name) | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $db.name }}
  labels:
    {{- include "booking.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  serviceName: {{ $db.name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "booking.selector" (list . $db.name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "booking.labels" . | nindent 8 }}
        {{- include "booking.selector" (list . $db.name) | nindent 8 }}
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: {{ $db.image }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: {{ include "booking.dbSecret" . }}, key: username } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "booking.dbSecret" . }}, key: password } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: {{ include "booking.dbSecret" . }}, key: database } }
            # дані — у підкаталозі тому (корінь тому може містити lost+found)
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml $db.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: {{ $db.name }}-init
  # том для кожної репліки; переживає видалення подів і helm upgrade
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ $db.storage }}
