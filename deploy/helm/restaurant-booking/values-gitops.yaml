# Значення середовища gitops: ArgoCD (deploy/argocd/booking-gitops.yaml) стежить за
# гілкою develop і застосовує чарт із цими значеннями. Зміна цього файлу в Git —
# єдиний спосіб змінити середовище: ручні зміни в кластері ArgoCD повертає (selfHeal).
bookingService:
  replicaCount: 1
  autoscaling:
    enabled: false
frontend:
  replicaCount: 1
postgresql:
  storage: 512Mi
ingress:
  host: gitops.booking.local
