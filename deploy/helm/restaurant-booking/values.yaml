# Значення за замовчуванням для локального кластера (minikube).
# Образи — з GitHub Container Registry, їх публікує робочий процес containers.yml.

image:
  registry: ghcr.io/danilara7
  # порожньо — береться appVersion з Chart.yaml (main); для відтворюваного
  # розгортання задається тег коміту: --set image.tag=<sha>
  tag: ""
  pullPolicy: Always

bookingService:
  name: booking-service          # ім'я Service: на нього проксіює nginx фронтенду
  image: booking-service
  replicaCount: 2
  port: 3000
  metricsPort: 9464              # /metrics для Prometheus (окремий порт, не за Ingress)
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      # 250m дроселювало Node.js під навантаженням так, що liveness-проба не встигала
      cpu: 500m
      memory: 128Mi
  # HPA: сервіс бронювання навантажений нерівномірно (вечори, вихідні) — ТЗ ЛР1
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 60

frontend:
  name: booking-frontend
  image: booking-frontend
  replicaCount: 2
  port: 80
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

postgresql:
  name: booking-db
  image: postgres:15-alpine
  database: booking
  username: booking
  # порожньо — пароль генерується при першому встановленні й зберігається в Secret
  password: ""
  storage: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

ingress:
  enabled: true
  className: nginx
  host: booking.local
  # завершення TLS на Ingress; сертифікат самопідписаний (генерує Helm)
  tls:
    enabled: true

# Етап 5: моніторинг. Потрібен kube-prometheus-stack (CRD ServiceMonitor і
# PrometheusRule, Grafana із sidecar дашбордів); без CRD ресурси не створюються.
monitoring:
  enabled: false
  # мітка, за якою Prometheus з kube-prometheus-stack обирає ServiceMonitor/PrometheusRule
  release: monitoring
  scrapeInterval: 15s
  alerts:
    # частка відповідей 5xx, за якої спрацьовує BookingHighErrorRate
    errorRatio: 0.05
    # 95-й перцентиль часу відповіді, с
    latencyP95: 0.5
    # частка конфліктів серед спроб бронювання (немає вільних столиків)
    conflictRatio: 0.5
