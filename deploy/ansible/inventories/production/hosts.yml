# Промислове середовище — локальний кластер minikube. Керуючий вузол (control)
# сам звертається до API Kubernetes, Vault і Prometheus, тому з'єднання локальне.
all:
  children:
    k8s_control:
      hosts:
        control:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
