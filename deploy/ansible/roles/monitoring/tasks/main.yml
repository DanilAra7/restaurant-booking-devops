---
- name: Add the prometheus-community Helm repository
  kubernetes.core.helm_repository:
    name: prometheus-community
    repo_url: https://prometheus-community.github.io/helm-charts

- name: Deploy the alert receiver (webhook for Alertmanager)
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    context: "{{ kube_context }}"
    definition: "{{ lookup('ansible.builtin.template', 'alert-receiver.yml.j2') | from_yaml_all | list }}"
  notify: Restart alert receiver

- name: Install kube-prometheus-stack (Prometheus, Alertmanager, Grafana)
  kubernetes.core.helm:
    kubeconfig: "{{ kubeconfig }}"
    context: "{{ kube_context }}"
    name: "{{ monitoring_release }}"
    chart_ref: prometheus-community/kube-prometheus-stack
    chart_version: "{{ monitoring_chart_version }}"
    release_namespace: "{{ monitoring_namespace }}"
    values: "{{ lookup('ansible.builtin.template', 'values.yml.j2') | from_yaml }}"
    wait: true
    timeout: 10m
