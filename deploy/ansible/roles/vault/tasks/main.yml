---
- name: Add the HashiCorp Helm repository
  kubernetes.core.helm_repository:
    name: hashicorp
    repo_url: https://helm.releases.hashicorp.com

- name: Install Vault (standalone, file storage on a PersistentVolume)
  kubernetes.core.helm:
    kubeconfig: "{{ kubeconfig }}"
    context: "{{ kube_context }}"
    name: "{{ vault_release }}"
    chart_ref: hashicorp/vault
    chart_version: "{{ vault_chart_version }}"
    release_namespace: "{{ vault_namespace }}"
    create_namespace: true
    values: "{{ lookup('ansible.builtin.template', 'values.yml.j2') | from_yaml }}"
    # запечатаний Vault не проходить readiness-пробу, тому без wait
    wait: false

# /v1/sys/health: 501 — не ініціалізований, 503 — запечатаний, 200 — готовий
- name: Wait for the Vault API
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/sys/health"
    status_code: [200, 429, 472, 473, 501, 503]
  register: vault_health
  retries: 30
  delay: 5
  until: vault_health.status in [200, 429, 472, 473, 501, 503]

- name: Initialize Vault (only once; one key share for the training cluster)
  when: not vault_health.json.initialized
  block:
    - name: Initialize
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/sys/init"
        method: PUT
        body_format: json
        body: { secret_shares: 1, secret_threshold: 1 }
      register: vault_init
      no_log: true

    - name: Create the directory for the init file
      ansible.builtin.file:
        path: "{{ vault_init_file | dirname }}"
        state: directory
        mode: "0700"

    # ключ розпечатування й кореневий токен — лише на керуючому вузлі, не в репозиторії
    - name: Save the unseal key and the root token
      ansible.builtin.copy:
        content: "{{ vault_init.json | to_nice_json }}"
        dest: "{{ vault_init_file }}"
        mode: "0600"
      no_log: true

- name: Read the unseal key and the root token
  ansible.builtin.slurp:
    src: "{{ vault_init_file }}"
  register: vault_init_raw
  no_log: true

- name: Remember Vault credentials
  ansible.builtin.set_fact:
    vault_unseal_key: "{{ (vault_init_raw.content | b64decode | from_json)['keys_base64'][0] }}"
    vault_root_token: "{{ (vault_init_raw.content | b64decode | from_json)['root_token'] }}"
  no_log: true

- name: Check the seal status
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/sys/seal-status"
  register: vault_seal

- name: Unseal Vault
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/sys/unseal"
    method: PUT
    body_format: json
    body: { key: "{{ vault_unseal_key }}" }
  when: vault_seal.json.sealed
  changed_when: true
  no_log: true

- name: Configure Vault (KV v2, policy, AppRole)
  ansible.builtin.include_tasks: configure.yml
