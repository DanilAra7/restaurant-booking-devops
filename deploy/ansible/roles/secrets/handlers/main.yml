---
# Grafana читає пароль адміністратора лише під час запуску; якщо Grafana вже
# встановлена — перезапуск подів підхоплює новий Secret. Якщо ще ні — нічого робити.
- name: Restart Grafana
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    context: "{{ kube_context }}"
    kind: Deployment
    name: monitoring-grafana
    namespace: "{{ monitoring_namespace }}"
    state: patched
    definition:
      spec:
        template:
          metadata:
            annotations:
              kubectl.kubernetes.io/restartedAt: "{{ now(utc=true).isoformat() }}"
  failed_when: false
