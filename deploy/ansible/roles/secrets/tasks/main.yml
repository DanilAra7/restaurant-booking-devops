---
# Vault — єдине джерело секретів: пароль генерується один раз і далі лише читається,
# тож повторне розгортання не змінює пароль бази даних
- name: Read secrets from Vault
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/secret/data/{{ item.path }}"
    headers: { X-Vault-Token: "{{ vault_token }}" }
    status_code: [200, 404]
  loop: "{{ secrets_vault_items }}"
  loop_control:
    label: "secret/{{ item.path }}"
  register: secrets_read

# Перенесення в Vault: якщо середовище вже працює (база даних ініціалізована
# паролем, який згенерував Helm-чарт), цей пароль імпортується у Vault, а не
# замінюється новим — інакше сервіс втратив би доступ до наявної бази даних
- name: Read the existing database Secret of the environment
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig }}"
    context: "{{ kube_context }}"
    kind: Secret
    name: booking-db-auth
    namespace: "{{ booking_namespace }}"
  register: secrets_existing_db
  no_log: true

- name: Generate missing secrets in Vault (or import the existing database password)
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/secret/data/{{ item.item.path }}"
    method: POST
    headers: { X-Vault-Token: "{{ vault_token }}" }
    body_format: json
    body:
      data: "{{ dict(item.item.fields | product([secrets_imported if (item.item.path is search('/db$') and secrets_imported) else secrets_new_password])) }}"
  vars:
    # /dev/null — пароль ніде не зберігається, крім Vault
    secrets_new_password: "{{ lookup('ansible.builtin.password', '/dev/null length=24 chars=ascii_letters,digits') }}"
    secrets_imported: "{{ (secrets_existing_db.resources | first).data.password | b64decode if secrets_existing_db.resources else '' }}"
  loop: "{{ secrets_read.results }}"
  loop_control:
    label: "secret/{{ item.item.path }}"
  when: item.status == 404
  changed_when: true
  no_log: true

- name: Read secrets after generation
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/secret/data/{{ item.path }}"
    headers: { X-Vault-Token: "{{ vault_token }}" }
  loop: "{{ secrets_vault_items }}"
  loop_control:
    label: "secret/{{ item.path }}"
  register: secrets_final
  no_log: true

- name: Remember secrets for the next roles
  ansible.builtin.set_fact:
    secrets_db_password: "{{ secrets_final.results[0].json.data.data.password }}"
    secrets_grafana_admin_password: "{{ secrets_final.results[1].json.data.data['admin-password'] }}"
    secrets_db_version: "{{ secrets_final.results[0].json.data.metadata.version }}"
  no_log: true

- name: Create the monitoring namespace
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    context: "{{ kube_context }}"
    kind: Namespace
    name: "{{ monitoring_namespace }}"

# Grafana бере обліковий запис адміністратора з цього Secret (admin.existingSecret)
- name: Grafana admin credentials from Vault
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    context: "{{ kube_context }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: grafana-admin
        namespace: "{{ monitoring_namespace }}"
        labels:
          app.kubernetes.io/managed-by: ansible
          vault-path: "booking.{{ booking_environment }}.grafana"
      type: Opaque
      stringData:
        admin-user: admin
        admin-password: "{{ secrets_grafana_admin_password }}"
  no_log: true
  notify: Restart Grafana
